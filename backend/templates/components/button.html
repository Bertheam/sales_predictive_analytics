{% if href %}
  <a href="{{ href }}" class="ui-button ui-button--{{ variant|default:'primary' }} inline-flex min-h-11 items-center justify-center gap-2 rounded-xl px-4 font-bold transition hover:-translate-y-px focus-visible:outline-2 focus-visible:outline-offset-2 {{ extra_classes|default:'' }}"{% if target %} target="{{ target }}"{% endif %}{% if rel %} rel="{{ rel }}"{% endif %}>{% if icon %}<i data-lucide="{{ icon }}" class="ui-icon" aria-hidden="true"></i>{% endif %}{{ label }}</a>
{% else %}
  <button type="{{ type|default:'button' }}" class="ui-button ui-button--{{ variant|default:'primary' }} inline-flex min-h-11 items-center justify-center gap-2 rounded-xl px-4 font-bold transition hover:-translate-y-px focus-visible:outline-2 focus-visible:outline-offset-2 {{ extra_classes|default:'' }}"{% if name %} name="{{ name }}"{% endif %}{% if value %} value="{{ value }}"{% endif %}{% if loading_label %} data-loading-label="{{ loading_label }}"{% endif %}{% if confirm_title %} data-confirm-title="{{ confirm_title }}" data-confirm-text="{{ confirm_text|default:'' }}"{% endif %}>{% if icon %}<i data-lucide="{{ icon }}" class="ui-icon" aria-hidden="true"></i>{% endif %}<span data-button-label>{{ label }}</span></button>
{% endif %}
