<th scope="col" aria-sort="{% if active %}{% if direction == 'asc' %}ascending{% else %}descending{% endif %}{% else %}none{% endif %}">
  <a class="group inline-flex min-h-9 items-center gap-1.5 rounded-lg px-1 transition hover:text-brand-700 focus-visible:outline-brand-500" href="{{ url }}" title="Trier par {{ label|lower }}">
    <span>{{ label }}</span>
    <span class="text-[10px] {% if active %}text-brand-600{% else %}text-slate-300 group-hover:text-brand-500{% endif %}" aria-hidden="true">{% if active and direction == 'asc' %}▲{% elif active %}▼{% else %}↕{% endif %}</span>
  </a>
</th>
