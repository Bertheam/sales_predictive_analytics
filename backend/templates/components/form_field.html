<div class="field-group min-w-0{% if span_two %} span-2 md:col-span-2{% endif %}{% if field.field.widget.input_type == 'checkbox' %} checkbox-group{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    {{ field }}<label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required-mark" aria-hidden="true"> *</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<small class="field-help">{{ field.help_text|safe }}</small>{% endif %}
  {% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
</div>
