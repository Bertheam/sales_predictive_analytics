{% if href %}<a href="{{ href }}" class="icon-button {{ variant|default:'' }}" aria-label="{{ label }}" title="{{ label }}"><span aria-hidden="true">{{ icon }}</span></a>{% else %}<button type="{{ type|default:'button' }}" class="icon-button {{ variant|default:'' }}" aria-label="{{ label }}" title="{{ label }}"{% if name %} name="{{ name }}"{% endif %}{% if value %} value="{{ value }}"{% endif %}><span aria-hidden="true">{{ icon }}</span></button>{% endif %}
