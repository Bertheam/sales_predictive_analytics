{% if active_company %}
  <details class="company-picker group relative z-20">
    <summary class="flex min-h-14 cursor-pointer list-none items-center gap-3 rounded-2xl border border-emerald-100 bg-gradient-to-br from-white to-emerald-50/70 px-3 py-2.5 text-left shadow-sm transition duration-300 hover:-translate-y-0.5 hover:border-emerald-200 hover:shadow-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500 motion-reduce:transform-none motion-reduce:transition-none">
      <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-emerald-100 text-sm font-black text-brand-700">{{ active_company.name|first|upper }}</span>
      <span class="hidden min-w-0 flex-1 sm:block">
        <small class="block text-[9px] font-extrabold uppercase tracking-[.12em] text-muted">Dépôt actif</small>
        <strong class="mt-0.5 block truncate text-xs text-ink">{{ active_company.name }}</strong>
      </span>
      <span class="text-xs text-muted transition duration-300 group-open:rotate-180 motion-reduce:transition-none" aria-hidden="true">⌄</span>
    </summary>
    <div class="company-picker__menu absolute left-0 top-[calc(100%+.55rem)] z-30 w-[min(290px,calc(100vw-2rem))] overflow-hidden rounded-2xl border border-line bg-white p-2 shadow-[0_22px_55px_rgba(17,47,38,.18)]">
      <div class="px-2.5 pb-2 pt-1.5">
        <strong class="block text-xs text-ink">Changer de dépôt</strong>
        <small class="mt-1 block text-[10px] leading-4 text-muted">Les ventes, stocks et prévisions resteront séparés.</small>
      </div>
      <div class="max-h-64 space-y-1 overflow-y-auto">
        {% for membership in available_memberships %}
          <form method="post" action="{% url 'companies:select' %}">
            {% csrf_token %}
            <input type="hidden" name="company_id" value="{{ membership.company_id }}">
            <input type="hidden" name="next" value="{{ request.get_full_path }}">
            <button type="submit" class="flex w-full items-center gap-3 rounded-xl px-2.5 py-2 text-left transition hover:bg-emerald-50 focus-visible:outline-brand-500 {% if membership.company_id == active_company.id %}bg-emerald-50{% endif %}"{% if membership.company_id == active_company.id %} aria-current="true"{% endif %}>
              <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg {% if membership.company_id == active_company.id %}bg-brand-600 text-white{% else %}bg-soft text-muted{% endif %} text-xs font-black">{{ membership.company.name|first|upper }}</span>
              <span class="min-w-0 flex-1"><strong class="block truncate text-xs text-ink">{{ membership.company.name }}</strong><small class="mt-0.5 block truncate text-[9px] text-muted">{{ membership.get_role_display }}{% if membership.company.city %} · {{ membership.company.city }}{% endif %}</small></span>
              {% if membership.company_id == active_company.id %}<span class="text-sm font-black text-brand-600" title="Dépôt actuellement sélectionné">✓</span>{% else %}<span class="text-xs text-muted">→</span>{% endif %}
            </button>
          </form>
        {% endfor %}
      </div>
      <div class="mt-2 grid grid-cols-2 gap-2"><a class="flex min-h-10 items-center justify-center rounded-xl border border-line text-[10px] font-extrabold text-muted transition hover:bg-soft" href="{% url 'companies:list' %}">Gérer</a><a class="flex min-h-10 items-center justify-center rounded-xl border border-dashed border-emerald-200 text-[10px] font-extrabold text-brand-700 transition hover:border-brand-500 hover:bg-emerald-50" href="{% url 'companies:onboarding' %}">+ Ajouter</a></div>
    </div>
  </details>
{% endif %}
