<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NexaStock{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f3f7f5;color:#12211d;font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{% block preheader %}{% endblock %}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f3f7f5;">
    <tr>
      <td align="center" style="padding:32px 14px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:620px;">
          <tr>
            <td style="padding:0 4px 18px;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td style="width:42px;height:42px;border-radius:13px;background:#0b7a5c;color:#ffffff;text-align:center;font-size:21px;font-weight:800;">N</td>
                  <td style="padding-left:12px;font-size:21px;font-weight:800;color:#12211d;">NexaStock</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="overflow:hidden;border:1px solid #dfe8e3;border-radius:24px;background:#ffffff;box-shadow:0 18px 45px rgba(17,47,38,.08);">
              <div style="height:8px;background:linear-gradient(90deg,#0b7a5c,#56d2a4);"></div>
              <div style="padding:42px 42px 36px;">
                {% block content %}{% endblock %}
              </div>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:20px 24px 0;color:#7a8983;font-size:12px;line-height:18px;">
              NexaStock · Gestion et pilotage prédictif des dépôts de boissons<br>
              Cet e-mail transactionnel a été envoyé automatiquement.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
