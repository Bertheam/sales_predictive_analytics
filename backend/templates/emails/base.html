<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NexaStock{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f4f7f5;color:#14251f;font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{% block preheader %}{% endblock %}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f4f7f5;">
    <tr>
      <td align="center" style="padding:32px 14px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;">
          <tr>
            <td style="padding:0 4px 18px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td width="34" height="34" style="width:34px;height:34px;border-radius:9px;background:#0d8060;color:#ffffff;text-align:center;font-size:17px;font-weight:900;">N</td>
                  <td style="padding-left:10px;color:#14251f;font-size:18px;font-weight:900;letter-spacing:-.3px;">NexaStock</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="border:1px solid #dce6e1;border-radius:16px;background:#ffffff;box-shadow:0 8px 24px rgba(20,37,31,.05);">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:18px 12px 0;color:#89968f;font-size:11px;line-height:17px;">
              Cet e-mail a été envoyé automatiquement par NexaStock.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
