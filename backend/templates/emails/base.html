<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NexaStock{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#edf3f0;color:#10221c;font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{% block preheader %}{% endblock %}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#edf3f0;">
    <tr>
      <td align="center" style="padding:28px 12px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:640px;">
          <tr>
            <td style="border-radius:24px 24px 0 0;background:#0a251c;padding:25px 30px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td valign="middle">
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                      <tr>
                        <td style="width:42px;height:42px;border-radius:12px;background:#16a275;color:#ffffff;text-align:center;font-size:21px;font-weight:900;">N</td>
                        <td style="padding-left:12px;color:#ffffff;font-size:21px;font-weight:900;letter-spacing:-.4px;">NexaStock</td>
                      </tr>
                    </table>
                  </td>
                  <td align="right" valign="middle">
                    <span style="display:inline-block;border:1px solid #245241;border-radius:999px;padding:8px 12px;color:#79dbb6;font-size:10px;font-weight:800;letter-spacing:1.2px;">STOCK · VENTES · J+7</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="border-right:1px solid #d8e4de;border-bottom:1px solid #d8e4de;border-left:1px solid #d8e4de;border-radius:0 0 24px 24px;background:#ffffff;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:18px 22px 0;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td style="color:#71817a;font-size:11px;line-height:17px;">NexaStock · Le centre de pilotage de votre dépôt</td>
                  <td align="right" style="color:#95a19c;font-size:10px;line-height:17px;">Message transactionnel sécurisé</td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
